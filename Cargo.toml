[package]
name = "cause"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "causes things in machines"
repository = "https://github.com/intfish/cause"
keywords = ["http", "webhook", "trigger", "sse", "remote"]
readme = "README.md"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "fs", "process", "io-util", "net", "time", "signal", "sync", "test-util"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
yescrypt = { version = "0.1.0", features = ["password-hash"] }
futures-util = "0.3.33"
lru = "0.18.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
clap = { version = "4.6.4", features = ["derive"] }
tower_governor = "0.8.0"
nix = { version = "0.31.3", features = ["process", "signal"] }
thiserror = "2.0.19"
anyhow = "1.0.104"
tokio-util = { version = "0.7.19", features = ["codec"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
