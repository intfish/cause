name: "cause"

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
            echo "sha_short=$(git rev-parse --short "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: git.int.fish
          username: norman
          password: ${{ secrets.REGISTRY_PACKAGER_PASSWORD }}

      - name: Build and push
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: git.int.fish/avalah/cause:latest,git.int.fish/avalah/cause:${{ env.sha_short }},ghcr.io/avalahee/cause:latest,ghcr.io/avalahee/cause:${{ env.sha_short }}
